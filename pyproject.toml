[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "penna-conversor"
version = "1.0.0"
description = "Conversor de planilhas Excel em TXT fiscal APAC-MAG (DATASUS/SIA)"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.3.3",
    "openpyxl==3.1.5",
    "reportlab==5.0.1",
    "Pillow==11.3.0",
    "tkinterdnd2==0.6.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist", "installer_output", "Temp", "Formatado", "dados", ".freebuff"]

[tool.ruff.lint]
# E9/F: erros de sintaxe e pyflakes. BLE001/S110: nada de `except Exception`
# generico nem `try/except/pass` engolindo erro (use excecao especifica ou log).
select = ["E9", "F", "BLE001", "S110"]

[tool.ruff.lint.per-file-ignores]
# Legado ainda nao migrado para excecoes especificas (BLE001/S110): reduzir
# esta lista, nunca aumentar.
"ui/components.py" = ["BLE001", "S110"]
"apac_mag_fichas.py" = ["BLE001", "S110"]
"apac_mag_remessa.py" = ["BLE001", "S110"]
"apac_mag_sigtap_download.py" = ["BLE001", "S110"]
"apac_mag_gerador.py" = ["BLE001", "S110"]
"apac_mag_gui.py" = ["BLE001", "S110"]
"tests/*" = ["BLE001", "S110"]
